
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Score Pro | Main Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: #f5f0fa;
    color: #342344;
}

.container {
    max-width: 1000px;
    margin: auto;
}

header {
    background: linear-gradient(135deg, #43245f, #7950a0);
    color: white;
    text-align: center;
    padding: 35px 20px;
    border-radius: 18px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

header p {
    margin: 0;
}

.info {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 14px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: 20px;
}

.panel {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 3px 12px #00000010;
}

.panel h2 {
    color: #573779;
    margin-top: 0;
}

.panel p {
    color: #777;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d8cce4;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    background: #68458c;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #493064;
}

.open-btn {
    background: #e9dff2;
    color: #573779;
}

.open-btn:hover {
    background: #d9c6e9;
}

footer {
    text-align: center;
    margin-top: 30px;
    color: #888;
    font-size: 13px;
}

@media(max-width: 650px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>RG SCORE PRO</h1>
    <p>Rhythmic Gymnastics Scoring System</p>
    <p>Main Judge Dashboard</p>
</header>

<div class="info">
    <h2>Competition Dashboard</h2>
    <label>Competition Name</label>
    <input id="competition" placeholder="Enter competition name">
    <p id="status">Add your judge website links below.</p>
</div>

<div class="grid">

    <div class="panel">
        <h2>DB Judge</h2>
        <p>Body Difficulties</p>
        <input id="db" placeholder="Paste DB website URL">
        <button onclick="saveLink('db')">Save DB Website</button>
        <button class="open-btn" onclick="openSite('db')">
            Open DB Judge
        </button>
    </div>

    <div class="panel">
        <h2>DA Judge</h2>
        <p>Apparatus Difficulties</p>
        <input id="da" placeholder="Paste DA website URL">
        <button onclick="saveLink('da')">Save DA Website</button>
        <button class="open-btn" onclick="openSite('da')">
            Open DA Judge
        </button>
    </div>

    <div class="panel">
        <h2>A Judge</h2>
        <p>Artistry</p>
        <input id="a" placeholder="Paste A website URL">
        <button onclick="saveLink('a')">Save A Website</button>
        <button class="open-btn" onclick="openSite('a')">
            Open A Judge
        </button>
    </div>

    <div class="panel">
        <h2>E Judge</h2>
        <p>Execution</p>
        <input id="e" placeholder="Paste E website URL">
        <button onclick="saveLink('e')">Save E Website</button>
        <button class="open-btn" onclick="openSite('e')">
            Open E Judge
        </button>
    </div>

</div>

<footer>
    RG SCORE PRO © 2026 | Rhythmic Gymnastics
</footer>

</div>

<script>
const judges = ["db", "da", "a", "e"];

function saveLink(role) {
    const input = document.getElementById(role);
    const url = input.value.trim();

    if (!url) {
        alert("Please enter a website URL.");
        return;
    }

    try {
        const parsed = new URL(url);

        if (parsed.protocol !== "https:" &&
            parsed.protocol !== "http:") {
            throw new Error("Invalid protocol");
        }

        localStorage.setItem("rg_" + role, parsed.href);
        alert(role.toUpperCase() + " website saved!");
    } catch {
        alert("Please enter a valid website URL beginning with https://");
    }
}

function openSite(role) {
    const url = localStorage.getItem("rg_" + role);

    if (!url) {
        alert("Please add and save the " + role.toUpperCase() +
              " website first.");
        return;
    }

    window.open(url, "_blank", "noopener,noreferrer");
}

window.onload = function() {
    judges.forEach(role => {
        const saved = localStorage.getItem("rg_" + role);
        if (saved) {
            document.getElementById(role).value = saved;
        }
    });
};
</script>

</body>
</html>
